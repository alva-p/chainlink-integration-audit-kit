name: Bug report
description: Report a reproducible problem with the CLI.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include third-party protocol vulnerability details here.
  - type: input
    id: version
    attributes:
      label: chainlink-audit version
      description: Run `chainlink-audit version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - npm global
        - npm exec / npx
        - source checkout
        - other
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Run `node --version`.
      placeholder: "v20.19.0"
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the command that failed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include output, stack trace, or generated report snippets.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link to a public repo or paste a minimal Solidity snippet when possible.
    validations:
      required: false
